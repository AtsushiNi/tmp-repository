schema_version: '1.0'
verified_on: '2026-09-30'
verification_method: 'Webページをブラウザ取得で確認。実機動作未検証'
product_versions:
  gitlab: '公式現行オンライン文書（バージョン固定なし）'
  gitlab_self_managed: '未確認'
  gitlab_runner: '未確認'
  claude_code: '公式現行オンライン文書（CLIバージョン固定なし）'
audience: 'Java/Maven経験あり、GitLab基本操作経験あり、CI/CDとClaude Codeは初心者'
initial_total_minutes: 105
implementation_instruction: 'MkDocsへの実装は別工程。記載内容以外を推測で補完しない。'
tracks:
  - id: gitlab-cicd
    title: GitLab CI/CD
    initial_minutes: 60
    lessons:
      - {id: gl-pipelines, minutes: 10, url: 'https://docs.gitlab.com/ja-jp/ci/pipelines/', scope: '冒頭、構成、実行契機', skip: '高度なパイプライン種別・運用管理', objective: 'pipelineを説明できる', reason: '公式日本語の概念説明', status: 'page_verified'}
      - {id: gl-jobs, minutes: 10, url: 'https://docs.gitlab.com/ja-jp/ci/jobs/', scope: '冒頭、ジョブ追加、ステージ', skip: '高度なジョブ制御', objective: 'jobとstageを区別できる', reason: '実行単位とログを解説', status: 'page_verified'}
      - {id: gl-quickstart, minutes: 25, url: 'https://docs.gitlab.com/ja-jp/ci/quick_start/', scope: '前提条件、Runner確認、YAML作成、パイプライン確認', skip: 'needs、rules、cache、artifactsの詳細', objective: 'YAMLから実行までの流れを説明できる', reason: '公式の段階的入門', status: 'page_verified'}
      - {id: gl-runners, minutes: 7, url: 'https://docs.gitlab.com/ja-jp/ci/runners/runners_scope/', scope: 'Runner種別と適用範囲', skip: '作成、登録、削除、トークン管理', objective: 'Runnerの役割を説明できる', reason: 'Runnerの種類が明確', status: 'page_verified'}
      - {id: gl-review, minutes: 8, local_section: 'guide.md#gitlab-cicd-理解度確認', scope: 'Java/Maven補足、設問1〜4', skip: 'なし', objective: '既存Java開発と関連付ける', reason: '研修独自補足', status: 'author_created'}
    advanced:
      - {url: 'https://docs.gitlab.com/ja-jp/ci/quick_start/tutorial/', minutes_estimate: 50, scope: '段階的な複数ジョブ構成', status: 'page_verified'}
      - {url: 'https://docs.gitlab.com/ja-jp/ci/yaml/', minutes_estimate: 50, scope: 'rules、needs、artifacts、cache、tags、resource_group', status: 'page_verified'}
    supplemental:
      - {url: 'https://zenn.dev/forcia_tech/articles/20191208_gitlab_ci_cd', status: 'page_verified_historical', note: '2019年記事。現行手順は公式で確認'}
  - id: claude-code
    title: Claude Code
    initial_minutes: 45
    lessons:
      - {id: cc-overview, minutes: 7, url: 'https://code.claude.com/docs/ja/overview', scope: '概要、用途、基本機能', skip: '連携の詳細', objective: 'エージェント型支援の役割を説明できる', reason: '現行公式日本語', status: 'page_verified'}
      - {id: cc-quickstart, minutes: 12, url: 'https://code.claude.com/docs/ja/quickstart', scope: '前提、起動、基本タスク', skip: 'OS別セットアップ詳細', objective: '起動から質問まで説明できる', reason: '公式の入門手順', status: 'page_verified'}
      - {id: cc-workflows, minutes: 12, url: 'https://code.claude.com/docs/ja/common-workflows', scope: 'コード理解、修正、テスト関連節', skip: '高度な外部連携', objective: '調査・修正・テストを段階的に指示できる', reason: '実務タスクに直結', status: 'page_verified'}
      - {id: cc-best-practices, minutes: 7, url: 'https://code.claude.com/docs/ja/best-practices', scope: '検証条件、変更確認、反復', skip: '高度な最適化', objective: 'AIの成果物を検証できる', reason: '品質確保に直結', status: 'page_verified'}
      - {id: cc-security, minutes: 3, url: 'https://code.claude.com/docs/ja/security', scope: '権限と安全性の概要', skip: '管理者向け詳細', objective: '危険な操作を承認前に見極める', reason: '企業利用で必須', status: 'page_verified'}
      - {id: cc-review, minutes: 4, local_section: 'guide.md#claude-code-理解度確認', scope: '設問5〜8', skip: 'なし', objective: '安全な利用と検証を説明できる', reason: '研修独自補足', status: 'author_created'}
    advanced:
      - {url: 'https://code.claude.com/docs/ja/common-workflows', minutes_estimate: 40, scope: 'Git操作、テスト、変更管理', status: 'page_verified'}
      - {url: 'https://code.claude.com/docs/ja/best-practices', minutes_estimate: 40, scope: '作業分割と検証', status: 'page_verified'}
      - {url: 'https://code.claude.com/docs/ja/security', minutes_estimate: 25, scope: '権限、承認、機密情報', status: 'page_verified'}
    supplemental:
      - {url: 'https://zenn.dev/appare/articles/claude-code-101-01-what-is-claude-code', status: 'page_verified_third_party', note: '2026-09の第三者日本語解説。現行仕様は公式優先'}
      - {url: 'https://zenn.dev/canly/articles/2e0d115e360144', status: 'page_verified_not_selected', note: '2025年のバージョン依存記述があるため非採用'}
validation:
  website_content: '主要ページの記述を確認'
  cli_execution: 'not_tested'
  gitlab_pipeline_execution: 'not_tested'
  enterprise_security_policy: 'not_verified'
  reading_time: 'author_estimate'
  caution: 'Claude Codeは外部Webアクセス不可。新機能・URL・バージョンを推測で補わない。'
